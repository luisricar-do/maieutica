<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel da coleta</title>
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --text: #1c2430;
  --muted: #5d6878;
  --border: #d9dee5;
  --accent: #2457c5;
  --accent-text: #ffffff;
  --ok: #1d7a46;
  --ok-bg: #e3f4ea;
  --warn: #8a5a00;
  --warn-bg: #fff3cd;
  --danger: #b42318;
  --danger-bg: #fde8e6;
  --neutral-bg: #e9ecf1;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161c;
    --surface: #1b2129;
    --surface-2: #232a34;
    --text: #e6ebf2;
    --muted: #9aa6b6;
    --border: #2f3844;
    --accent: #6c9cff;
    --accent-text: #0d1320;
    --ok: #5fd08f;
    --ok-bg: #173325;
    --warn: #f3c552;
    --warn-bg: #3a2f12;
    --danger: #ff8a7f;
    --danger-bg: #3d1a17;
    --neutral-bg: #2a323d;
    --shadow: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
header.top {
  position: sticky; top: 0; z-index: 2;
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
header.top h1 { font-size: 18px; margin: 0; font-weight: 650; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
main { padding: 16px 20px 40px; max-width: 1500px; margin: 0 auto; }
button {
  font: inherit; cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text);
  padding: 6px 10px; border-radius: 8px;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.danger { color: var(--danger); }
label.toggle { display: inline-flex; align-items: center; gap: 6px; user-select: none; }
input[type=password], input[type=text] {
  font: inherit; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  min-width: 260px;
}
.login {
  max-width: 440px; margin: 12vh auto 0; padding: 24px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
}
.login h1 { margin-top: 0; font-size: 20px; }
.login form { display: flex; gap: 8px; flex-wrap: wrap; }
.login input { flex: 1; }
.alert { padding: 10px 12px; border-radius: 8px; margin: 12px 0; }
.alert.error { background: var(--danger-bg); color: var(--danger); }
.alert.warn { background: var(--warn-bg); color: var(--warn); }
.summary {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 12px; margin-bottom: 16px;
}
.stat {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 14px; box-shadow: var(--shadow);
}
.stat .value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .label { color: var(--muted); font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); gap: 14px; }
@media (max-width: 520px) {
  header.top, main { padding-left: 16px; padding-right: 16px; }
  input[type=password] { min-width: 0; }
}
.card {
  min-width: 0;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 16px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 10px;
}
.card.stale-warn { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn) inset; }
.card.stale-danger { border-color: var(--danger); box-shadow: 0 0 0 2px var(--danger) inset; }
.card.ended { opacity: .78; }
.card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.pid { font-size: 18px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.badge {
  display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
  background: var(--neutral-bg); color: var(--muted);
}
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.danger { background: var(--danger-bg); color: var(--danger); }
.current {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--surface-2); border-radius: 10px; padding: 10px 12px;
}
.current .task-label { font-weight: 600; }
.countdown { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.countdown.low { color: var(--warn); }
.countdown.over { color: var(--danger); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px 14px; font-size: 14px; }
.facts b { font-variant-numeric: tabular-nums; }
.facts .wide { grid-column: 1 / -1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--neutral-bg); color: var(--text); }
.chip.solved { background: var(--ok-bg); color: var(--ok); }
.chip.timeout { background: var(--warn-bg); color: var(--warn); }
.chip.aborted, .chip.skipped { background: var(--danger-bg); color: var(--danger); }
.age.warn { color: var(--warn); font-weight: 700; }
.age.danger { color: var(--danger); font-weight: 700; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
details.log summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details.log ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
details.log li { margin: 2px 0; }
.empty { text-align: center; padding: 40px; color: var(--muted); }
.hidden { display: none !important; }
</style>
</head>
<body>

<section id="login" class="login hidden">
  <h1>Painel do condutor</h1>
  <p class="muted">Cole o token do condutor (<code>STUDY_ADMIN_TOKEN</code>). Ele fica só nesta aba.</p>
  <div id="login-error" class="alert error hidden"></div>
  <form id="login-form" autocomplete="off">
    <input id="token-input" type="password" placeholder="Token" required>
    <button class="primary" type="submit">Entrar</button>
  </form>
</section>

<div id="app" class="hidden">
  <header class="top">
    <h1>Painel da coleta</h1>
    <label class="toggle"><input id="only-active" type="checkbox" checked> Só ativas</label>
    <label class="toggle"><input id="include-test" type="checkbox"> Incluir sessões de teste</label>
    <span class="spacer"></span>
    <span class="muted small" id="last-update">Ainda não atualizado</span>
    <button id="refresh" type="button">Atualizar agora</button>
    <button id="logout" type="button" title="Esquecer o token nesta aba">Sair</button>
  </header>
  <main>
    <div id="error" class="alert error hidden"></div>
    <section class="summary" id="summary"></section>
    <section class="grid" id="sessions"></section>
  </main>
</div>

<script>
(function () {
  "use strict";

  /* A página vive em /api/painel; as rotas de dados são irmãs (/api/painel/sessoes...). */
  var API = window.location.pathname.replace(/\/painel\/?$/, "/");
  var TOKEN_KEY = "painelToken";
  var PREFS_KEY = "painelPrefs";
  var POLL_MS = 10000;
  var ACTIVE_WINDOW_MS = 30 * 60000;
  var STALE_WARN_MS = 2 * 60000;
  var STALE_DANGER_MS = 5 * 60000;

  var state = { sessions: [], serverOffsetMs: 0, loading: false, token: null };
  var pollTimer = null;

  function $(id) { return document.getElementById(id); }

  function storageGet(store, key) { try { return store.getItem(key); } catch (e) { return null; } }
  function storageSet(store, key, value) { try { store.setItem(key, value); } catch (e) { /* sem armazenamento */ } }
  function storageDel(store, key) { try { store.removeItem(key); } catch (e) { /* sem armazenamento */ } }

  /* Em memória e no sessionStorage (sobrevive ao F5, some ao fechar a aba). */
  function token() { return state.token || storageGet(window.sessionStorage, TOKEN_KEY); }

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function parseTime(iso) {
    var t = iso ? Date.parse(iso) : NaN;
    return isNaN(t) ? null : t;
  }

  /* Agora no relógio do servidor (o lastEventAt é serverTs): corrige o relógio deste notebook. */
  function serverNow() { return Date.now() + state.serverOffsetMs; }

  function fmtDuration(ms) {
    var total = Math.max(0, Math.round(ms / 1000));
    var h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
    if (h > 0) return h + " h " + String(m).padStart(2, "0") + " min";
    if (m > 0) return m + " min " + String(s).padStart(2, "0") + " s";
    return s + " s";
  }

  function fmtClock(ms) {
    var total = Math.round(Math.abs(ms) / 1000);
    var m = Math.floor(total / 60), s = total % 60;
    return (ms < 0 ? "-" : "") + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  function fmtHour(iso) {
    var t = parseTime(iso);
    return t == null ? "—" : new Date(t).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  function shortLabel(task) {
    if (task.label) return String(task.label).split(" — ")[0];
    return task.practice ? "Treino" : "T" + task.task;
  }

  var OUTCOMES = { solved: "resolvida", timeout: "tempo esgotado", aborted: "abortada" };
  var KINDS = {
    extend: "+ tempo", accept: "Aceitar como resolvida", skip: "Pular tarefa", end_session: "Encerrar sessão"
  };

  function ageMs(session) {
    var t = parseTime(session.lastEventAt);
    return t == null ? Infinity : serverNow() - t;
  }

  function isActive(session) { return !session.sessionEnded && ageMs(session) < ACTIVE_WINDOW_MS; }

  function staleLevel(session) {
    if (!session.currentTask) return "";
    var age = ageMs(session);
    if (age > STALE_DANGER_MS) return "danger";
    if (age > STALE_WARN_MS) return "warn";
    return "";
  }

  /* ---------------------------------------------------------------- preferências */

  function loadPrefs() {
    try {
      var prefs = JSON.parse(storageGet(window.localStorage, PREFS_KEY) || "{}");
      if (typeof prefs.onlyActive === "boolean") $("only-active").checked = prefs.onlyActive;
      if (typeof prefs.includeTest === "boolean") $("include-test").checked = prefs.includeTest;
    } catch (e) { /* preferências corrompidas: fica o padrão */ }
  }

  function savePrefs() {
    storageSet(window.localStorage, PREFS_KEY, JSON.stringify({
      onlyActive: $("only-active").checked, includeTest: $("include-test").checked
    }));
  }

  /* ---------------------------------------------------------------- API */

  function api(path, options) {
    options = options || {};
    var headers = { "Authorization": "Bearer " + token() };
    if (options.body) headers["Content-Type"] = "application/json";
    return fetch(API + path, {
      method: options.method || "GET",
      headers: headers,
      body: options.body ? JSON.stringify(options.body) : undefined,
      cache: "no-store"
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (res.status === 401) { showLogin("Token inválido."); throw new Error("401"); }
        if (!res.ok) throw new Error(body.error || ("HTTP " + res.status));
        return body;
      });
    });
  }

  function refresh() {
    if (state.loading || !token()) return;
    state.loading = true;
    $("refresh").disabled = true;
    var requestedAt = Date.now();
    api("painel/sessoes").then(function (body) {
      var generated = parseTime(body.generatedAt);
      if (generated != null) state.serverOffsetMs = generated - (requestedAt + Date.now()) / 2;
      state.sessions = Array.isArray(body.sessions) ? body.sessions : [];
      $("error").classList.add("hidden");
      $("last-update").textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR");
      render();
    }).catch(function (err) {
      if (err.message === "401") return;
      $("error").textContent = "Falha ao atualizar: " + err.message;
      $("error").classList.remove("hidden");
    }).finally(function () {
      state.loading = false;
      $("refresh").disabled = false;
    });
  }

  function sendCommand(session, kind, extra) {
    var body = { sessionId: session.sessionId, kind: kind };
    for (var k in (extra || {})) body[k] = extra[k];
    return api("painel/comandos", { method: "POST", body: body }).then(function () {
      refresh();
    }).catch(function (err) {
      if (err.message !== "401") alert("Não foi possível registrar: " + err.message);
    });
  }

  /* ---------------------------------------------------------------- render */

  function visibleSessions() {
    var onlyActive = $("only-active").checked, includeTest = $("include-test").checked;
    return state.sessions.filter(function (s) {
      if (!includeTest && s.isTest) return false;
      if (onlyActive && !isActive(s)) return false;
      return true;
    }).sort(function (a, b) { return ageMs(a) - ageMs(b); });
  }

  function renderSummary() {
    var includeTest = $("include-test").checked;
    var pool = state.sessions.filter(function (s) { return includeTest || !s.isTest; });
    var active = 0, solved = 0, timeouts = 0, withErrors = 0, stuck = 0;
    pool.forEach(function (s) {
      if (isActive(s)) active++;
      if (staleLevel(s) === "danger") stuck++;
      if (s.tutorErrors > 0) withErrors++;
      (s.tasks || []).forEach(function (t) {
        if (t.practice) return;
        if (t.outcome === "solved") solved++;
        if (t.outcome === "timeout") timeouts++;
      });
    });
    var stats = [
      [active, "participantes ativos agora"],
      [solved, "cenários resolvidos"],
      [timeouts, "tempos esgotados"],
      [withErrors, "sessões com erro do tutor"],
      [stuck, "máquinas sem sinal há mais de 5 min"]
    ];
    $("summary").innerHTML = stats.map(function (s) {
      return '<div class="stat"><div class="value">' + s[0] + '</div><div class="label">' + esc(s[1]) + "</div></div>";
    }).join("");
  }

  function renderTaskChips(session) {
    var done = (session.tasks || []).filter(function (t) { return t.endedAt || t.outcome; });
    if (!done.length) return '<span class="muted small">Nenhuma tarefa encerrada.</span>';
    return done.map(function (t) {
      var cls = t.outcome || "";
      var text = shortLabel(t) + ": " + (OUTCOMES[t.outcome] || t.outcome || "?");
      if (t.endedBy === "conductor") text += " (condutor)";
      var title = (t.label || "") + (t.elapsedMs != null ? " · " + fmtDuration(t.elapsedMs) : "") +
        (t.studentTurns != null ? " · " + t.studentTurns + " turnos" : "") +
        (t.failedChecks ? " · " + t.failedChecks + " «Concluí» falhos" : "");
      return '<span class="chip ' + esc(cls) + '" title="' + esc(title) + '">' + esc(text) + "</span>";
    }).join("");
  }

  function renderCurrent(session) {
    var c = session.currentTask;
    if (session.sessionEnded) return '<div class="current"><span class="badge">Sessão encerrada</span></div>';
    if (!c) return '<div class="current"><span class="muted">Sem tarefa em curso</span></div>';
    var extra = c.extraMs ? ' <span class="badge ok">+' + Math.round(c.extraMs / 60000) + " min</span>" : "";
    var checks = c.failedChecks
      ? '<span class="badge warn">' + c.failedChecks + " «Concluí» falho" + (c.failedChecks > 1 ? "s" : "") + "</span>"
      : "";
    return '<div class="current"><div><div class="task-label">' + esc(c.label || shortLabel(c)) +
      (c.practice ? ' <span class="badge">treino</span>' : "") + extra + "</div>" +
      '<div class="small muted">início ' + esc(fmtHour(c.startedAt)) + " " + checks + "</div></div>" +
      '<div class="countdown" data-countdown="' + esc(session.sessionId) + '">--:--</div></div>';
  }

  function renderLog(session) {
    var commands = session.commands || [], notes = session.notes || [];
    if (!commands.length && !notes.length) return "";
    var pending = commands.filter(function (c) { return !c.applied; }).length;
    var items = commands.map(function (c) {
      var label = c.kind === "extend" ? "+" + (c.minutes || 5) + " min" : (KINDS[c.kind] || c.kind);
      return "<li>" + esc(fmtHour(c.createdAt)) + " · " + esc(label) + " · " +
        (c.applied ? '<span class="badge ok">aplicado</span>' : '<span class="badge warn">pendente</span>') + "</li>";
    }).concat(notes.map(function (n) {
      return "<li>" + esc(fmtHour(n.createdAt)) + " · <em>incidente:</em> " + esc(n.text) + "</li>";
    }));
    var summary = commands.length + " comando" + (commands.length === 1 ? "" : "s") +
      (pending ? " (" + pending + " pendente" + (pending > 1 ? "s" : "") + ")" : "") +
      (notes.length ? " · " + notes.length + " incidente" + (notes.length > 1 ? "s" : "") : "");
    return '<details class="log"' + (pending ? " open" : "") + "><summary>" + esc(summary) + "</summary><ul>" + items.join("") + "</ul></details>";
  }

  function renderCard(session) {
    var pid = session.participantId ? String(session.participantId).slice(0, 8) : "(sem pseudônimo)";
    var total = Array.isArray(session.taskOrder) && session.taskOrder.length ? session.taskOrder.length : 6;
    var noTask = !session.currentTask || session.sessionEnded;
    var sid = esc(session.sessionId);
    var badges = [
      session.condition ? '<span class="badge">' + esc(session.condition) + "</span>" : "",
      session.isTest ? '<span class="badge warn">teste</span>' : "",
      session.sessionEnded ? '<span class="badge">encerrada</span>' : ""
    ].join(" ");
    return '<article class="card" data-session="' + sid + '">' +
      '<div class="card-head"><span class="pid" title="' + esc(session.participantId || "") + '">' + esc(pid) + "</span>" +
      badges + '<span class="spacer"></span><span class="small muted" title="sessionId">' + esc(String(session.sessionId).slice(0, 13)) + "</span></div>" +
      renderCurrent(session) +
      '<div class="facts">' +
      "<div>Cenários: <b>" + session.completedScenarios + "/" + total + "</b></div>" +
      "<div>Turnos c/ tutor: <b>" + session.chatTurns + "</b></div>" +
      "<div>Erros do tutor: <b" + (session.tutorErrors ? ' style="color:var(--danger)"' : "") + ">" + session.tutorErrors + "</b></div>" +
      '<div class="wide">Último evento: <b class="age" data-age="' + sid + '">—</b></div>' +
      "</div>" +
      '<div class="chips">' + renderTaskChips(session) + "</div>" +
      '<div class="actions">' +
      '<button type="button" data-act="extend"' + (noTask ? " disabled" : "") + ">+5 min</button>" +
      '<button type="button" data-act="accept"' + (noTask ? " disabled" : "") + ">Aceitar como resolvida</button>" +
      '<button type="button" data-act="skip"' + (noTask ? " disabled" : "") + ">Pular tarefa</button>" +
      '<button type="button" class="danger" data-act="end_session"' + (session.sessionEnded ? " disabled" : "") + ">Encerrar sessão</button>" +
      '<button type="button" data-act="note">Anotar incidente</button>' +
      "</div>" + renderLog(session) + "</article>";
  }

  function render() {
    renderSummary();
    var list = visibleSessions();
    $("sessions").innerHTML = list.length
      ? list.map(renderCard).join("")
      : '<div class="empty">Nenhuma sessão ' + ($("only-active").checked ? "ativa " : "") + "no momento.</div>";
    tick();
  }

  function findSession(id) {
    for (var i = 0; i < state.sessions.length; i++) if (state.sessions[i].sessionId === id) return state.sessions[i];
    return null;
  }

  /* Atualização a cada segundo: só cronômetros e idades, sem redesenhar os cartões. */
  function tick() {
    document.querySelectorAll("[data-countdown]").forEach(function (el) {
      var s = findSession(el.getAttribute("data-countdown"));
      var c = s && s.currentTask;
      var start = c && parseTime(c.startedAt);
      if (!c || start == null || c.timeboxMs == null) { el.textContent = "--:--"; return; }
      // startedAt é o relógio do aluno, o mesmo do cronômetro da IDE.
      var remaining = start + c.timeboxMs + (c.extraMs || 0) - Date.now();
      el.textContent = fmtClock(remaining);
      el.classList.toggle("over", remaining <= 0);
      el.classList.toggle("low", remaining > 0 && remaining < 2 * 60000);
      el.title = remaining <= 0 ? "Tempo esgotado: a IDE deveria ter encerrado a tarefa" : "Tempo restante";
    });
    document.querySelectorAll("[data-age]").forEach(function (el) {
      var s = findSession(el.getAttribute("data-age"));
      if (!s) return;
      var age = ageMs(s), level = staleLevel(s);
      el.textContent = age === Infinity ? "—" : "há " + fmtDuration(age) + (s.lastEventType ? " (" + s.lastEventType + ")" : "");
      el.className = "age" + (level ? " " + level : "");
      var card = el.closest(".card");
      if (card) {
        card.classList.toggle("stale-warn", level === "warn");
        card.classList.toggle("stale-danger", level === "danger");
        card.classList.toggle("ended", !!s.sessionEnded);
      }
    });
  }

  function onAction(event) {
    var button = event.target.closest("button[data-act]");
    if (!button) return;
    var card = button.closest("[data-session]");
    var session = card && findSession(card.getAttribute("data-session"));
    if (!session) return;
    var who = session.participantId ? String(session.participantId).slice(0, 8) : session.sessionId;
    var task = session.currentTask ? (session.currentTask.label || shortLabel(session.currentTask)) : "";
    var act = button.getAttribute("data-act");
    if (act === "note") {
      var text = prompt("Incidente na sessão de " + who + " (fica só no registro, não vai para a IDE):");
      if (text && text.trim()) sendCommand(session, "note", { text: text.trim().slice(0, 500) });
      return;
    }
    var questions = {
      extend: "Dar +5 min na tarefa «" + task + "» de " + who + "?",
      accept: "Aceitar «" + task + "» como resolvida para " + who + " e avançar?",
      skip: "Pular «" + task + "» de " + who + " (encerra sem resolver e avança)?",
      end_session: "Encerrar a sessão de " + who + "? A máquina volta ao formulário para o próximo participante."
    };
    if (!confirm(questions[act])) return;
    sendCommand(session, act, act === "extend" ? { minutes: 5 } : null);
  }

  /* ---------------------------------------------------------------- login */

  function showLogin(message) {
    state.token = null;
    storageDel(window.sessionStorage, TOKEN_KEY);
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    $("app").classList.add("hidden");
    $("login").classList.remove("hidden");
    $("login-error").textContent = message || "";
    $("login-error").classList.toggle("hidden", !message);
    $("token-input").focus();
  }

  function showApp() {
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    refresh();
    if (!pollTimer) pollTimer = setInterval(refresh, POLL_MS);
  }

  $("login-form").addEventListener("submit", function (event) {
    event.preventDefault();
    var value = $("token-input").value.trim();
    if (!value) return;
    state.token = value;
    storageSet(window.sessionStorage, TOKEN_KEY, value);
    $("token-input").value = "";
    showApp();
  });
  $("logout").addEventListener("click", function () { showLogin(""); });
  $("refresh").addEventListener("click", refresh);
  $("only-active").addEventListener("change", function () { savePrefs(); render(); });
  $("include-test").addEventListener("change", function () { savePrefs(); render(); });
  $("sessions").addEventListener("click", onAction);
  setInterval(tick, 1000);

  loadPrefs();
  if (token()) showApp(); else showLogin("");
})();
</script>
</body>
</html>
