<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel da coleta</title>
<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --surface-3: #e7eaef;
  --text: #1c2430;
  --muted: #5d6878;
  --border: #d9dee5;
  --accent: #2457c5;
  --accent-soft: #e6edfb;
  --accent-text: #ffffff;
  --ok: #1d7a46;
  --ok-bg: #e3f4ea;
  --warn: #8a5a00;
  --warn-bg: #fff3cd;
  --danger: #b42318;
  --danger-bg: #fde8e6;
  --neutral-bg: #e9ecf1;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, .18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11151b;
    --surface: #1a2028;
    --surface-2: #222933;
    --surface-3: #2a323d;
    --text: #e6ebf2;
    --muted: #9aa6b6;
    --border: #2f3844;
    --accent: #6c9cff;
    --accent-soft: #1d2a45;
    --accent-text: #0d1320;
    --ok: #5fd08f;
    --ok-bg: #173325;
    --warn: #f3c552;
    --warn-bg: #3a2f12;
    --danger: #ff8a7f;
    --danger-bg: #3d1a17;
    --neutral-bg: #2a323d;
    --shadow: none;
    --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.spacer { flex: 1; }
.hidden { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

button, select, input, textarea { font: inherit; color: var(--text); }
button {
  cursor: pointer; white-space: nowrap;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 6px 11px; border-radius: 8px;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.danger { color: var(--danger); }
button.danger.solid { background: var(--danger); color: #fff; border-color: var(--danger); }
button.ghost { background: transparent; border-color: transparent; }
button.ghost:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border); }
button.sm { padding: 3px 8px; font-size: 12.5px; border-radius: 6px; }
select, input[type=text], input[type=password], input[type=date], input[type=search], textarea {
  padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
}
select.sm { padding: 3px 6px; font-size: 12.5px; border-radius: 6px; }
textarea { width: 100%; min-height: 90px; resize: vertical; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------------------------------------------------------------- login */
.login {
  max-width: 420px; margin: 12vh auto 0; padding: 24px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
}
.login h1 { margin-top: 0; font-size: 20px; }
.login form { display: flex; gap: 8px; }
.login input { flex: 1; min-width: 0; }
@media (max-width: 480px) { .login { margin: 8vh 16px 0; } }

/* ---------------------------------------------------------------- topo */
header.top {
  position: sticky; top: 0; z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 20px; max-width: 1600px; margin: 0 auto; }
.bar h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 650; }
#view-select { min-width: 240px; max-width: 100%; font-weight: 600; }
.sync { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.ok { background: var(--ok); }
.dot.err { background: var(--danger); }

.coleta-bar { border-top: 1px solid var(--border); background: var(--surface-2); }
.coleta-bar .bar { padding: 8px 20px; }
.coleta-name { font-weight: 650; font-size: 15px; }
.coleta-hint { flex-basis: 100%; margin-top: -2px; }

main { padding: 14px 20px 60px; max-width: 1600px; margin: 0 auto; }
@media (max-width: 600px) {
  .bar, .coleta-bar .bar, main { padding-left: 16px; padding-right: 16px; }
  .bar h1 { flex-basis: 100%; }
  #view-select { min-width: 0; flex: 1 1 0; }
  .sync { display: none; }
  #search { flex: 1 1 100%; width: auto; }
}

.alert { padding: 10px 12px; border-radius: 8px; margin: 0 0 12px; }
.alert.error { background: var(--danger-bg); color: var(--danger); }
.alert.info { background: var(--accent-soft); color: var(--text); }

/* ---------------------------------------------------------------- resumo */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 10px; margin-bottom: 12px; }
.stat {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 9px 12px; box-shadow: var(--shadow); text-align: left; cursor: default;
}
button.stat { cursor: pointer; font: inherit; }
.stat .value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat .label { color: var(--muted); font-size: 12.5px; }
.stat.warn .value { color: var(--warn); }
.stat.danger .value { color: var(--danger); }
.stat.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

/* ---------------------------------------------------------------- barra de filtros */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; }
.seg { display: inline-flex; max-width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.seg button { border: 0; border-radius: 0; padding: 6px 11px; background: transparent; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg .count { color: var(--muted); font-weight: 400; margin-left: 4px; }
#search { width: 220px; max-width: 100%; }
label.toggle { display: inline-flex; align-items: center; gap: 6px; user-select: none; }

.bulk {
  position: sticky; top: var(--top-h, 60px); z-index: 4;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 8px 12px; margin-bottom: 10px; border-radius: 10px;
  background: var(--accent-soft); border: 1px solid var(--accent);
}

/* ---------------------------------------------------------------- lista */
.list { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.cols {
  display: grid; align-items: center; gap: 10px;
  grid-template-columns: 22px minmax(110px, 1fr) 118px minmax(170px, 2.2fr) 76px 108px minmax(110px, 1fr) 84px 22px;
  padding: 8px 12px;
}
.list-head { background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; border-bottom: 1px solid var(--border); }
.row { border-bottom: 1px solid var(--border); border-left: 3px solid transparent; }
.row:last-child { border-bottom: 0; }
.row > .cols { cursor: pointer; }
.row > .cols:hover { background: var(--surface-2); }
.row.lvl-warn { border-left-color: var(--warn); }
.row.lvl-danger { border-left-color: var(--danger); background: color-mix(in srgb, var(--danger-bg) 45%, transparent); }
.row.selected > .cols { background: var(--accent-soft); }
.row.ended .who, .row.ended .task-cell { opacity: .7; }
.row.open > .cols { background: var(--surface-2); }

.who { min-width: 0; }
.pid { font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-cell { min-width: 0; }
.task-cell .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.countdown { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.countdown.low { color: var(--warn); }
.countdown.over { color: var(--danger); }
.age { font-variant-numeric: tabular-nums; white-space: nowrap; }
.age.warn { color: var(--warn); font-weight: 700; }
.age.danger { color: var(--danger); font-weight: 700; }
.chev { color: var(--muted); transition: transform .15s; text-align: center; }
.row.open .chev { transform: rotate(90deg); }

.badge {
  display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  background: var(--neutral-bg); color: var(--muted); white-space: nowrap;
}
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.danger { background: var(--danger-bg); color: var(--danger); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }

.pips { display: inline-flex; gap: 4px; align-items: center; }
.pip { width: 16px; height: 16px; border-radius: 4px; background: var(--surface-3); border: 1px solid var(--border); }
.pip.practice { width: 10px; border-radius: 3px; }
.pip.solved { background: var(--ok); border-color: var(--ok); }
.pip.timeout { background: var(--warn); border-color: var(--warn); }
.pip.aborted, .pip.skipped { background: var(--danger); border-color: var(--danger); }
.pip.current { border: 2px solid var(--accent); background: var(--accent-soft); }
.pip.ended-other { background: var(--muted); border-color: var(--muted); }

.detail { padding: 4px 16px 16px 47px; background: var(--surface-2); border-top: 1px dashed var(--border); }
.detail-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
.detail h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin: 12px 0 6px; }
.detail table { width: 100%; border-collapse: collapse; font-size: 13px; }
.detail th, .detail td { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
.detail th { color: var(--muted); font-weight: 600; font-size: 12px; }
.detail ul { margin: 0; padding-left: 18px; font-size: 13px; }
.detail li { margin: 2px 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.actions .sep { width: 1px; background: var(--border); margin: 0 4px; }

.empty { text-align: center; padding: 48px 16px; color: var(--muted); }
.empty b { color: var(--text); display: block; margin-bottom: 4px; font-size: 15px; }

@media (max-width: 960px) {
  .list-head { display: none; }
  .row > .cols {
    grid-template-columns: 22px minmax(0, 1fr) auto;
    grid-template-areas: "sel who time" "sel task task" "sel prog age" "sel tutor status";
    row-gap: 6px;
  }
  .c-sel { grid-area: sel; align-self: start; }
  .c-who { grid-area: who; }
  .c-status { grid-area: status; justify-self: end; }
  .c-task { grid-area: task; }
  .c-time { grid-area: time; justify-self: end; }
  .c-prog { grid-area: prog; }
  .c-age { grid-area: age; justify-self: end; }
  .c-tutor { grid-area: tutor; }
  .c-chev { display: none; }
  .detail { padding-left: 16px; }
  .detail-grid { grid-template-columns: 1fr; }
}

/* ---------------------------------------------------------------- diálogo e aviso */
dialog {
  border: 1px solid var(--border); border-radius: 12px; padding: 0; width: min(460px, calc(100vw - 32px));
  background: var(--surface); color: var(--text); box-shadow: var(--shadow-lg);
}
dialog::backdrop { background: rgba(10, 14, 20, .45); }
dialog form { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
dialog h2 { margin: 0; font-size: 17px; }
dialog .msg { margin: 0; color: var(--muted); white-space: pre-line; }
dialog .field { display: flex; flex-direction: column; gap: 4px; }
dialog .field > span { font-weight: 600; font-size: 13px; }
dialog .field input[type=text], dialog .field input[type=date], dialog .field select { width: 100%; }
dialog .hint { font-size: 12px; color: var(--muted); }
dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 20; display: flex; flex-direction: column; gap: 8px; max-width: calc(100vw - 32px); }
.toast {
  padding: 10px 14px; border-radius: 10px; background: var(--text); color: var(--bg);
  box-shadow: var(--shadow-lg); font-size: 13.5px; max-width: 420px;
}
.toast.error { background: var(--danger); color: #fff; }
</style>
</head>
<body>

<section id="login" class="login hidden">
  <h1>Painel do condutor</h1>
  <p class="muted">Digite a senha do condutor. Ela fica só nesta aba.</p>
  <div id="login-error" class="alert error hidden"></div>
  <form id="login-form" autocomplete="off">
    <input id="token-input" type="password" placeholder="Senha" autocomplete="off" required>
    <button class="primary" type="submit">Entrar</button>
  </form>
</section>

<div id="app" class="hidden">
  <header class="top" id="top">
    <div class="bar">
      <h1>Painel da coleta</h1>
      <select id="view-select" aria-label="Coleta exibida"></select>
      <button id="new-coleta" type="button" class="primary">+ Nova coleta</button>
      <span class="spacer"></span>
      <span class="sync small muted" title="Atualiza sozinho a cada 10 s"><span class="dot" id="sync-dot"></span><span id="last-update">Ainda não atualizado</span></span>
      <button id="refresh" type="button" class="sm">Atualizar</button>
      <button id="logout" type="button" class="sm ghost" title="Esquecer a senha nesta aba">Sair</button>
    </div>
    <div class="coleta-bar hidden" id="coleta-bar">
      <div class="bar" id="coleta-bar-inner"></div>
    </div>
  </header>

  <main>
    <div id="error" class="alert error hidden"></div>
    <section class="stats" id="stats"></section>

    <div class="toolbar">
      <div class="seg" id="filter-seg" role="group" aria-label="Filtro"></div>
      <input id="search" type="search" placeholder="Buscar pseudônimo ou sessão" title="Atalho: /" aria-label="Buscar">
      <label class="toggle small"><input id="include-test" type="checkbox"> Sessões de teste</label>
      <span class="spacer"></span>
      <label class="small muted" for="sort-select">Ordenar</label>
      <select id="sort-select">
        <option value="priority">Prioridade</option>
        <option value="time">Menos tempo restante</option>
        <option value="recent">Último sinal</option>
        <option value="pid">Pseudônimo</option>
      </select>
    </div>

    <div class="bulk hidden" id="bulk"></div>

    <section class="list" id="list" aria-live="polite"></section>
  </main>
</div>

<dialog id="dlg">
  <form method="dialog" id="dlg-form">
    <h2 id="dlg-title"></h2>
    <p class="msg" id="dlg-msg"></p>
    <div id="dlg-fields"></div>
    <div class="buttons">
      <button type="button" id="dlg-cancel">Cancelar</button>
      <button type="submit" id="dlg-ok" class="primary">OK</button>
    </div>
  </form>
</dialog>

<div class="toasts" id="toasts"></div>

<script>
(function () {
  "use strict";

  /* A página vive em /api/painel; as rotas de dados são irmãs (/api/painel/sessoes...). */
  var API = window.location.pathname.replace(/\/painel\/?$/, "/");
  var TOKEN_KEY = "painelToken";
  var PREFS_KEY = "painelPrefs";
  var POLL_MS = 10000;
  var ACTIVE_WINDOW_MS = 30 * 60000;
  var STALE_WARN_MS = 2 * 60000;
  var STALE_DANGER_MS = 5 * 60000;
  var LOW_TIME_MS = 2 * 60000;
  var PENDING_WARN_MS = 30000;
  /* A ordem sorteada tem o treino e os seis cenários, mas cada estudante faz três (TASKS_PER_PARTICIPANT na IDE). */
  var SCENARIOS = 3;
  var VIEW_ALL = "todas", VIEW_NONE = "sem", VIEW_TRASH = "lixeira";

  var state = {
    token: null, view: null, coletas: [], sessions: [], trashCount: 0,
    serverOffsetMs: 0, loading: false, requestSeq: 0,
    expanded: {}, selected: {}, filter: "all", search: "", sort: "priority", includeTest: false
  };
  var pollTimer = null;

  function $(id) { return document.getElementById(id); }

  function storageGet(store, key) { try { return store.getItem(key); } catch (e) { return null; } }
  function storageSet(store, key, value) { try { store.setItem(key, value); } catch (e) { /* sem armazenamento */ } }
  function storageDel(store, key) { try { store.removeItem(key); } catch (e) { /* sem armazenamento */ } }

  /* Em memória e no sessionStorage (sobrevive ao F5, some ao fechar a aba). */
  function token() { return state.token || storageGet(window.sessionStorage, TOKEN_KEY); }

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function parseTime(iso) {
    var t = iso ? Date.parse(iso) : NaN;
    return isNaN(t) ? null : t;
  }

  /* Agora no relógio do servidor (o lastEventAt é serverTs): corrige o relógio deste notebook. */
  function serverNow() { return Date.now() + state.serverOffsetMs; }

  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  function fmtDuration(ms) {
    var total = Math.max(0, Math.round(ms / 1000));
    var h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
    if (h > 0) return h + " h " + String(m).padStart(2, "0") + " min";
    if (m > 0) return m + " min " + String(s).padStart(2, "0") + " s";
    return s + " s";
  }

  function fmtShortAge(ms) {
    if (ms === Infinity) return "—";
    var s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + " s";
    if (s < 3600) return Math.floor(s / 60) + " min";
    return Math.floor(s / 3600) + " h " + String(Math.floor((s % 3600) / 60)).padStart(2, "0");
  }

  function fmtClock(ms) {
    var total = Math.round(Math.abs(ms) / 1000);
    var m = Math.floor(total / 60), s = total % 60;
    return (ms < 0 ? "-" : "") + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  function fmtHour(iso) {
    var t = parseTime(iso);
    return t == null ? "—" : new Date(t).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }

  function fmtDate(day) {
    if (!day) return "";
    var p = String(day).split("-");
    return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : day;
  }

  function todayIso() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function shortLabel(task) {
    if (task.label) return String(task.label).split(" — ")[0];
    return task.practice ? "Treino" : "T" + task.task;
  }

  function pidOf(s) { return s.participantId ? String(s.participantId).slice(0, 8) : null; }
  function whoOf(s) { return pidOf(s) || ("sessão " + String(s.sessionId || "").slice(0, 8)); }

  var OUTCOMES = { solved: "resolvida", timeout: "tempo esgotado", aborted: "abortada", skipped: "pulada" };
  var KINDS = { extend: "+ tempo", accept: "Aceitar como resolvida", skip: "Pular tarefa", end_session: "Encerrar sessão" };
  var STATUS_LABEL = { aberta: "aberta", encerrada: "encerrada", planejada: "planejada" };

  /* ---------------------------------------------------------------- análise de uma sessão */

  function ageMs(s) {
    var t = parseTime(s.lastEventAt);
    return t == null ? Infinity : serverNow() - t;
  }

  function isActive(s) { return !s.sessionEnded && !s.descarte && ageMs(s) < ACTIVE_WINDOW_MS; }

  function remainingMs(s) {
    var c = s.currentTask;
    var start = c && parseTime(c.startedAt);
    if (!c || s.sessionEnded || start == null || c.timeboxMs == null) return null;
    // startedAt é o relógio do aluno, o mesmo do cronômetro da IDE.
    return start + c.timeboxMs + (c.extraMs || 0) - Date.now();
  }

  function staleLevel(s) {
    if (!s.currentTask || s.sessionEnded) return "";
    var age = ageMs(s);
    if (age > STALE_DANGER_MS) return "danger";
    if (age > STALE_WARN_MS) return "warn";
    return "";
  }

  function statusOf(s) {
    if (s.descarte) return { key: "trash", text: "Na lixeira", cls: "" };
    if (s.sessionEnded) return { key: "ended", text: "Encerrada", cls: "" };
    if (s.currentTask) return s.currentTask.practice
      ? { key: "task", text: "Treino", cls: "accent" }
      : { key: "task", text: "Em tarefa", cls: "accent" };
    if (s.completedScenarios >= SCENARIOS) return { key: "done", text: "Concluiu", cls: "ok" };
    if (ageMs(s) >= ACTIVE_WINDOW_MS) return { key: "idle", text: "Inativa", cls: "" };
    return { key: "waiting", text: s.participantId ? "Entre tarefas" : "No formulário", cls: "" };
  }

  /* Motivos para o condutor olhar a sessão agora; o nível mais alto pinta a linha. */
  function flagsOf(s) {
    var flags = [];
    if (s.descarte) return flags;
    var stale = staleLevel(s);
    if (stale) flags.push({ level: stale, text: "sem sinal há " + fmtShortAge(ageMs(s)) });
    var rem = remainingMs(s);
    if (rem != null && rem <= 0) flags.push({ level: "danger", text: "tempo esgotado sem encerrar" });
    else if (rem != null && rem < LOW_TIME_MS) flags.push({ level: "warn", text: "menos de 2 min" });
    var pending = (s.commands || []).filter(function (c) {
      return !c.applied && serverNow() - (parseTime(c.createdAt) || serverNow()) > PENDING_WARN_MS;
    }).length;
    if (pending && !s.sessionEnded) flags.push({ level: "warn", text: plural(pending, "comando pendente", "comandos pendentes") });
    var failed = s.currentTask ? s.currentTask.failedChecks : 0;
    if (failed >= 2) flags.push({ level: "warn", text: failed + " «Concluí» falhos" });
    if (s.tutorErrors > 0) flags.push({ level: "warn", text: plural(s.tutorErrors, "erro do tutor", "erros do tutor") });
    return flags;
  }

  function levelOf(flags) {
    if (flags.some(function (f) { return f.level === "danger"; })) return "danger";
    return flags.length ? "warn" : "";
  }

  /* ---------------------------------------------------------------- preferências */

  function loadPrefs() {
    try {
      var prefs = JSON.parse(storageGet(window.localStorage, PREFS_KEY) || "{}");
      if (typeof prefs.includeTest === "boolean") state.includeTest = prefs.includeTest;
      if (typeof prefs.sort === "string") state.sort = prefs.sort;
      if (typeof prefs.filter === "string") state.filter = prefs.filter;
      if (typeof prefs.view === "string") state.view = prefs.view;
    } catch (e) { /* preferências corrompidas: fica o padrão */ }
    $("include-test").checked = state.includeTest;
    $("sort-select").value = state.sort;
  }

  function savePrefs() {
    storageSet(window.localStorage, PREFS_KEY, JSON.stringify({
      includeTest: state.includeTest, sort: state.sort, filter: state.filter, view: state.view
    }));
  }

  /* ---------------------------------------------------------------- API */

  function request(path, options) {
    options = options || {};
    var headers = { "Authorization": "Bearer " + token() };
    if (options.body) headers["Content-Type"] = "application/json";
    return fetch(API + path, {
      method: options.method || "GET",
      headers: headers,
      body: options.body ? JSON.stringify(options.body) : undefined,
      cache: "no-store"
    }).then(function (res) {
      if (res.status === 401) { showLogin("Senha incorreta."); throw new Error("401"); }
      if (res.status === 429) { showLogin("Muitas tentativas erradas. Espere 15 minutos."); throw new Error("401"); }
      return res;
    });
  }

  function api(path, options) {
    return request(path, options).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (!res.ok) { var err = new Error(body.error || ("HTTP " + res.status)); err.status = res.status; throw err; }
        return body;
      });
    });
  }

  function viewParam() { return state.view || VIEW_ALL; }

  function refresh() {
    if (!token()) return;
    var seq = ++state.requestSeq;
    state.loading = true;
    $("refresh").disabled = true;
    var requestedAt = Date.now();
    api("painel/sessoes?coleta=" + encodeURIComponent(viewParam())).then(function (body) {
      if (seq !== state.requestSeq) return;  // troca de visão no meio: resposta velha
      var generated = parseTime(body.generatedAt);
      if (generated != null) state.serverOffsetMs = generated - (requestedAt + Date.now()) / 2;
      state.coletas = Array.isArray(body.coletas) ? body.coletas : [];
      state.sessions = Array.isArray(body.sessions) ? body.sessions : [];
      state.trashCount = body.trashCount || 0;
      if (!state.view) {
        // Primeira carga sem preferência: abre direto na coleta aberta, se houver.
        var open = state.coletas.filter(function (c) { return c.status === "aberta"; })[0];
        if (open) { setView(open.id); return; }
        state.view = VIEW_ALL;
      }
      $("error").classList.add("hidden");
      $("sync-dot").className = "dot ok";
      $("last-update").textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR");
      // Antes do render: com zero sessões, loading ainda true deixaria «Carregando…» na tela.
      state.loading = false;
      render();
    }).catch(function (err) {
      if (err.message === "401" || seq !== state.requestSeq) return;
      if (err.status === 404 && state.view !== VIEW_ALL) {
        toast("Essa coleta não existe mais; mostrando todas.", true);
        setView(VIEW_ALL);
        return;
      }
      state.loading = false;
      renderList();
      $("sync-dot").className = "dot err";
      $("error").textContent = "Falha ao atualizar: " + err.message + ". Os dados abaixo podem estar desatualizados.";
      $("error").classList.remove("hidden");
    }).finally(function () {
      if (seq !== state.requestSeq) return;
      state.loading = false;
      $("refresh").disabled = false;
    });
  }

  function setView(view) {
    state.view = view;
    state.selected = {};
    state.expanded = {};
    state.sessions = [];
    savePrefs();
    render();
    refresh();
  }

  function fail(err) {
    if (err && err.message !== "401") toast("Não deu certo: " + err.message, true);
  }

  function sendCommand(s, kind, extra) {
    var body = { sessionId: s.sessionId, kind: kind };
    for (var k in (extra || {})) body[k] = extra[k];
    return api("painel/comandos", { method: "POST", body: body }).then(function () {
      toast(kind === "note" ? "Incidente anotado." : "Comando enviado para " + whoOf(s) + ". A IDE aplica em até ~10 s.");
      refresh();
    }).catch(fail);
  }

  function sessionAction(acao, ids, extra) {
    var body = { acao: acao, sessionIds: ids };
    for (var k in (extra || {})) body[k] = extra[k];
    return api("painel/sessoes/acoes", { method: "POST", body: body }).then(function (res) {
      ids.forEach(function (id) { delete state.selected[id]; });
      refresh();
      return res;
    });
  }

  function coletaAction(body) {
    return api("painel/coletas", { method: "POST", body: body }).then(function (res) {
      state.coletas = res.coletas || state.coletas;
      return res;
    });
  }

  function download(coletaId, formato) {
    var q = "painel/exportar?coleta=" + encodeURIComponent(coletaId) + "&formato=" + encodeURIComponent(formato);
    toast("Preparando o arquivo…");
    request(q).then(function (res) {
      if (!res.ok) return res.json().catch(function () { return {}; }).then(function (b) { throw new Error(b.error || ("HTTP " + res.status)); });
      var name = (/filename="([^"]+)"/.exec(res.headers.get("Content-Disposition") || "") || [])[1] || (coletaId + "-" + formato);
      return res.blob().then(function (blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      });
    }).catch(fail);
  }

  /* ---------------------------------------------------------------- aviso e diálogo */

  function toast(message, isError) {
    var el = document.createElement("div");
    el.className = "toast" + (isError ? " error" : "");
    el.textContent = message;
    $("toasts").appendChild(el);
    setTimeout(function () { el.remove(); }, isError ? 6000 : 3500);
  }

  /*
   * Diálogo único: título, mensagem, campos e, se pedido, uma palavra a digitar para
   * liberar o botão. Resolve com os valores dos campos ou null (cancelado).
   */
  function ask(opts) {
    var dlg = $("dlg"), form = $("dlg-form"), ok = $("dlg-ok");
    $("dlg-title").textContent = opts.title;
    $("dlg-msg").textContent = opts.message || "";
    $("dlg-msg").classList.toggle("hidden", !opts.message);
    var fields = (opts.fields || []).slice();
    if (opts.requireText) fields.push({ name: "__confirm", type: "text", label: "Digite " + opts.requireText + " para confirmar", required: true });
    $("dlg-fields").innerHTML = fields.map(function (f) {
      var id = "dlg-f-" + f.name, input;
      if (f.type === "textarea") {
        input = '<textarea id="' + id + '" name="' + f.name + '" maxlength="' + (f.maxLength || 500) + '"' + (f.required ? " required" : "") +
          ' placeholder="' + esc(f.placeholder || "") + '">' + esc(f.value || "") + "</textarea>";
      } else if (f.type === "select") {
        input = '<select id="' + id + '" name="' + f.name + '">' + f.options.map(function (o) {
          return '<option value="' + esc(o.value) + '"' + (o.value === f.value ? " selected" : "") + ">" + esc(o.label) + "</option>";
        }).join("") + "</select>";
      } else if (f.type === "checkbox") {
        return '<label class="toggle"><input type="checkbox" id="' + id + '" name="' + f.name + '"' + (f.value ? " checked" : "") + "> " + esc(f.label) + "</label>" +
          (f.hint ? '<div class="hint">' + esc(f.hint) + "</div>" : "");
      } else {
        input = '<input type="' + (f.type || "text") + '" id="' + id + '" name="' + f.name + '" value="' + esc(f.value || "") + '"' +
          (f.maxLength ? ' maxlength="' + f.maxLength + '"' : "") + (f.required ? " required" : "") + ' placeholder="' + esc(f.placeholder || "") + '" autocomplete="off">';
      }
      return '<label class="field" for="' + id + '"><span>' + esc(f.label) + "</span>" + input +
        (f.hint ? '<span class="hint">' + esc(f.hint) + "</span>" : "") + "</label>";
    }).join("");
    $("dlg-fields").classList.toggle("hidden", !fields.length);
    ok.textContent = opts.confirmLabel || "Confirmar";
    ok.className = opts.danger ? "danger solid" : "primary";

    function syncLock() {
      if (!opts.requireText) { ok.disabled = false; return; }
      ok.disabled = ($("dlg-f-__confirm").value.trim().toUpperCase() !== opts.requireText);
    }
    syncLock();

    return new Promise(function (resolve) {
      function values() {
        var out = {};
        (opts.fields || []).forEach(function (f) {
          var el = $("dlg-f-" + f.name);
          out[f.name] = f.type === "checkbox" ? el.checked : el.value;
        });
        return out;
      }
      function cleanup(result) {
        form.removeEventListener("submit", onSubmit);
        form.removeEventListener("input", syncLock);
        $("dlg-cancel").removeEventListener("click", onCancel);
        dlg.removeEventListener("cancel", onCancel);
        if (dlg.open) dlg.close();
        resolve(result);
      }
      function onSubmit(e) { e.preventDefault(); if (!ok.disabled) cleanup(values()); }
      function onCancel(e) { if (e) e.preventDefault(); cleanup(null); }
      form.addEventListener("submit", onSubmit);
      form.addEventListener("input", syncLock);
      $("dlg-cancel").addEventListener("click", onCancel);
      dlg.addEventListener("cancel", onCancel);
      dlg.showModal();
      var first = $("dlg-fields").querySelector("input:not([type=checkbox]), textarea, select");
      (first || ok).focus();
    });
  }

  /* ---------------------------------------------------------------- coletas */

  function currentColeta() {
    for (var i = 0; i < state.coletas.length; i++) if (state.coletas[i].id === state.view) return state.coletas[i];
    return null;
  }

  function coletaOptionLabel(c) {
    var mark = c.status === "aberta" ? "● " : "";
    return mark + c.nome + " · " + fmtDate(c.data) + (c.status !== "aberta" ? " (" + STATUS_LABEL[c.status] + ")" : "");
  }

  function coletaName(id) {
    for (var i = 0; i < state.coletas.length; i++) if (state.coletas[i].id === id) return state.coletas[i].nome;
    return id;
  }

  function renderViewSelect() {
    var sel = $("view-select");
    var opts = state.coletas.map(function (c) {
      return '<option value="' + esc(c.id) + '">' + esc(coletaOptionLabel(c)) + "</option>";
    });
    var html = (opts.length ? '<optgroup label="Coletas">' + opts.join("") + "</optgroup>" : "") +
      '<optgroup label="Outras visões">' +
      '<option value="' + VIEW_ALL + '">Todas as sessões (24 h)</option>' +
      '<option value="' + VIEW_NONE + '">Sem coleta (24 h)</option>' +
      '<option value="' + VIEW_TRASH + '">Lixeira (' + state.trashCount + ")</option></optgroup>";
    if (sel.innerHTML !== html) sel.innerHTML = html;
    sel.value = viewParam();
  }

  function renderColetaBar() {
    var c = currentColeta(), bar = $("coleta-bar"), inner = $("coleta-bar-inner");
    if (!c) {
      var text = state.view === VIEW_TRASH
        ? "Sessões descartadas. Não entram nas visões nem nas exportações. Restaure ou apague de vez."
        : state.view === VIEW_NONE
          ? "Sessões das últimas 24 h que não caíram em nenhuma coleta. Selecione e mova para a coleta certa."
          : "Todas as sessões com sinal nas últimas 24 h, de qualquer coleta.";
      inner.innerHTML = '<span class="muted small">' + esc(text) + "</span>";
      bar.classList.remove("hidden");
      return;
    }
    var badge = c.status === "aberta" ? "ok" : c.status === "encerrada" ? "" : "warn";
    var hint;
    if (c.status === "planejada") hint = "Abra a coleta quando os participantes começarem: as sessões com sinal desde a abertura entram nela sozinhas.";
    else if (c.status === "aberta") hint = "Aberta às " + fmtHour(c.abertaEm) + ". Toda sessão com sinal desde então entra aqui; ao abrir outra coleta, esta se encerra.";
    else hint = "Janela: " + fmtHour(c.abertaEm) + " – " + fmtHour(c.encerradaEm) + ". Sessões fora dela só entram se movidas à mão.";
    inner.innerHTML =
      '<span class="coleta-name">' + esc(c.nome) + "</span>" +
      '<span class="muted">' + esc(fmtDate(c.data)) + "</span>" +
      '<span class="badge ' + badge + '">' + esc(STATUS_LABEL[c.status]) + "</span>" +
      '<span class="spacer"></span>' +
      (c.status === "aberta"
        ? '<button type="button" class="sm" data-coleta="encerrar">Encerrar coleta</button>'
        : '<button type="button" class="sm primary" data-coleta="abrir">' + (c.status === "encerrada" ? "Reabrir" : "Abrir agora") + "</button>") +
      '<button type="button" class="sm" data-coleta="editar">Editar</button>' +
      '<select class="sm" id="export-select" aria-label="Exportar"><option value="">Exportar…</option>' +
      '<option value="resumo">Resumo por tarefa (.csv)</option>' +
      '<option value="eventos">Eventos da telemetria (.ndjson)</option>' +
      '<option value="interacoes">Turnos do tutor (.ndjson)</option></select>' +
      '<button type="button" class="sm ghost danger" data-coleta="excluir">Excluir</button>' +
      '<span class="coleta-hint small muted">' + esc(hint) + "</span>";
    bar.classList.remove("hidden");
  }

  function onColetaBar(event) {
    var c = currentColeta();
    var btn = event.target.closest("[data-coleta]");
    if (!c || !btn) return;
    var act = btn.getAttribute("data-coleta");
    if (act === "abrir") {
      var other = state.coletas.filter(function (o) { return o.status === "aberta" && o.id !== c.id; })[0];
      var msg = other ? "A coleta «" + other.nome + "» está aberta e será encerrada agora." : "";
      ask({ title: (c.status === "encerrada" ? "Reabrir" : "Abrir") + " «" + c.nome + "»?", message: msg, confirmLabel: c.status === "encerrada" ? "Reabrir" : "Abrir" }).then(function (ok) {
        if (ok) coletaAction({ acao: "abrir", id: c.id }).then(function () { toast("Coleta aberta."); refresh(); }).catch(fail);
      });
    } else if (act === "encerrar") {
      ask({ title: "Encerrar «" + c.nome + "»?", message: "Sessões que começarem depois disto não entram mais nesta coleta. Dá para reabrir depois.", confirmLabel: "Encerrar" }).then(function (ok) {
        if (ok) coletaAction({ acao: "encerrar", id: c.id }).then(function () { toast("Coleta encerrada."); refresh(); }).catch(fail);
      });
    } else if (act === "editar") {
      ask({
        title: "Editar coleta", confirmLabel: "Salvar",
        fields: [
          { name: "nome", label: "Nome", value: c.nome, required: true, maxLength: 80 },
          { name: "data", label: "Data", type: "date", value: c.data, required: true }
        ]
      }).then(function (v) {
        if (v) coletaAction({ acao: "editar", id: c.id, nome: v.nome, data: v.data }).then(function () { toast("Coleta atualizada."); refresh(); }).catch(fail);
      });
    } else if (act === "excluir") {
      ask({
        title: "Excluir a coleta «" + c.nome + "»?", danger: true, confirmLabel: "Excluir coleta",
        message: "Só o rótulo some: nenhuma sessão é apagada. As sessões dela passam para outra coleta cuja janela as cubra ou ficam sem coleta."
      }).then(function (ok) {
        if (ok) coletaAction({ acao: "excluir", id: c.id }).then(function () { toast("Coleta excluída."); setView(VIEW_ALL); }).catch(fail);
      });
    }
  }

  function newColeta() {
    var open = state.coletas.filter(function (c) { return c.status === "aberta"; })[0];
    ask({
      title: "Nova coleta", confirmLabel: "Criar",
      fields: [
        { name: "nome", label: "Nome", placeholder: "ex.: Turma A — manhã", required: true, maxLength: 80 },
        { name: "data", label: "Data", type: "date", value: todayIso(), required: true },
        { name: "abrir", label: "Abrir agora", type: "checkbox", value: true,
          hint: open ? "Encerra «" + open.nome + "», que está aberta." : "Sessões com sinal a partir de agora entram nesta coleta." }
      ]
    }).then(function (v) {
      if (!v) return;
      coletaAction({ acao: "criar", nome: v.nome, data: v.data, abrir: v.abrir }).then(function (res) {
        toast("Coleta «" + res.coleta.nome + "» criada" + (v.abrir ? " e aberta." : "."));
        setView(res.coleta.id);
      }).catch(fail);
    });
  }

  /* ---------------------------------------------------------------- render */

  function inPool(s) { return state.includeTest || !s.isTest; }

  function matchesFilter(s, filter) {
    var st = statusOf(s).key;
    if (filter === "attention") return flagsOf(s).length > 0;
    if (filter === "active") return isActive(s);
    if (filter === "task") return st === "task";
    if (filter === "finished") return st === "ended" || st === "done";
    return true;
  }

  function matchesSearch(s) {
    var q = state.search.trim().toLowerCase();
    if (!q) return true;
    return [s.participantId, s.sessionId, s.installId].some(function (v) { return v && String(v).toLowerCase().indexOf(q) >= 0; });
  }

  function sortKey(s) {
    var flags = flagsOf(s), level = levelOf(flags);
    var rem = remainingMs(s);
    var statusRank = { task: 0, waiting: 1, done: 2, ended: 3, idle: 4, trash: 5 }[statusOf(s).key];
    return {
      level: level === "danger" ? 0 : level === "warn" ? 1 : 2,
      status: statusRank,
      rem: rem == null ? Infinity : rem,
      age: ageMs(s),
      pid: (s.participantId || "~" + s.sessionId).toLowerCase()
    };
  }

  function compare(a, b) {
    var ka = sortKey(a), kb = sortKey(b);
    if (state.sort === "pid") return ka.pid < kb.pid ? -1 : ka.pid > kb.pid ? 1 : 0;
    if (state.sort === "recent") return ka.age - kb.age;
    if (state.sort === "time") return (ka.rem - kb.rem) || (ka.age - kb.age);
    return (ka.level - kb.level) || (ka.status - kb.status) || (ka.rem - kb.rem) || (ka.age - kb.age);
  }

  function visibleSessions() {
    return state.sessions.filter(function (s) {
      return inPool(s) && matchesFilter(s, state.filter) && matchesSearch(s);
    }).sort(compare);
  }

  function renderStats() {
    var pool = state.sessions.filter(inPool);
    var active = 0, attention = 0, inTask = 0, done = 0, solved = 0, timeouts = 0, errors = 0;
    pool.forEach(function (s) {
      if (isActive(s)) active++;
      if (flagsOf(s).length) attention++;
      if (statusOf(s).key === "task") inTask++;
      if (s.completedScenarios >= SCENARIOS) done++;
      if (s.tutorErrors > 0) errors++;
      (s.tasks || []).forEach(function (t) {
        if (t.practice) return;
        if (t.outcome === "solved") solved++;
        if (t.outcome === "timeout") timeouts++;
      });
    });
    var scope = currentColeta() ? "" : " (24 h)";
    var stats = [
      { v: pool.length, l: "sessões" + scope, f: "all" },
      { v: active, l: "ativas agora", f: "active" },
      { v: attention, l: "precisam de atenção", f: "attention", cls: attention ? "danger" : "" },
      { v: inTask, l: "em tarefa", f: "task" },
      { v: done + "/" + pool.length, l: "concluíram os " + SCENARIOS + " cenários", f: "finished" },
      { v: solved, l: "cenários resolvidos" },
      { v: timeouts, l: "tempos esgotados", cls: timeouts ? "warn" : "" },
      { v: errors, l: "sessões com erro do tutor", cls: errors ? "warn" : "" }
    ];
    $("stats").innerHTML = stats.map(function (s) {
      var tag = s.f ? "button" : "div";
      return "<" + tag + (s.f ? ' type="button" data-filter="' + s.f + '"' : "") + ' class="stat ' + (s.cls || "") + (s.f && state.filter === s.f ? " on" : "") + '">' +
        '<div class="value">' + esc(s.v) + '</div><div class="label">' + esc(s.l) + "</div></" + tag + ">";
    }).join("");
  }

  function renderFilters() {
    var pool = state.sessions.filter(function (s) { return inPool(s) && matchesSearch(s); });
    var defs = [["all", "Todas"], ["attention", "Atenção"], ["active", "Ativas"], ["task", "Em tarefa"], ["finished", "Encerradas"]];
    $("filter-seg").innerHTML = defs.map(function (d) {
      var n = pool.filter(function (s) { return matchesFilter(s, d[0]); }).length;
      return '<button type="button" data-filter="' + d[0] + '" class="' + (state.filter === d[0] ? "on" : "") + '">' + d[1] + '<span class="count">' + n + "</span></button>";
    }).join("");
  }

  function renderPips(s) {
    var tasks = s.tasks || [];
    var practice = tasks.filter(function (t) { return t.practice; })[0];
    var scen = tasks.filter(function (t) { return !t.practice; });
    var cur = s.currentTask;
    function pip(t, isPractice) {
      if (!t) return '<span class="pip' + (isPractice ? " practice" : "") + '" title="' + (isPractice ? "Treino" : "Cenário ainda não iniciado") + '"></span>';
      var open = cur && cur.task === t.task && !t.endedAt;
      var cls = open ? "current" : (t.outcome || (t.endedAt ? "ended-other" : "current"));
      var title = shortLabel(t) + ": " + (open ? "em curso" : (OUTCOMES[t.outcome] || t.outcome || "?")) +
        (t.endedBy === "conductor" ? " (condutor)" : "") + (t.elapsedMs != null ? " · " + fmtDuration(t.elapsedMs) : "");
      return '<span class="pip ' + esc(cls) + (isPractice ? " practice" : "") + '" title="' + esc(title) + '"></span>';
    }
    var html = pip(practice, true);
    for (var i = 0; i < Math.max(SCENARIOS, scen.length); i++) html += pip(scen[i], false);
    return '<span class="pips">' + html + "</span>";
  }

  function renderRow(s) {
    var sid = esc(s.sessionId);
    var st = statusOf(s), flags = flagsOf(s), level = levelOf(flags);
    var open = !!state.expanded[s.sessionId], selected = !!state.selected[s.sessionId];
    var c = s.currentTask;
    var pid = pidOf(s);
    var who = '<div class="pid" title="' + esc(s.participantId || "") + '">' + esc(pid || "(sem pseudônimo)") + "</div>" +
      '<div class="sub">' + (s.isTest ? '<span class="badge warn">teste</span> ' : "") +
      (s.coletaManual && state.view !== VIEW_TRASH ? '<span class="badge" title="Movida à mão">manual</span> ' : "") +
      (state.view === VIEW_ALL && s.coletaId ? esc(coletaName(s.coletaId)) + " · " : "") +
      '<span class="mono">' + esc(String(s.sessionId).slice(0, 8)) + "</span></div>";
    var task;
    if (c && !s.sessionEnded) {
      task = '<div class="t" title="' + esc(c.label || "") + '">' + esc(c.label || shortLabel(c)) + "</div>" +
        '<div class="sub">início ' + esc(fmtHour(c.startedAt)) + (c.extraMs ? " · +" + Math.round(c.extraMs / 60000) + " min" : "") +
        (c.checks ? " · " + plural(c.checks, "«Concluí»", "«Concluí»") : "") + "</div>";
    } else if (s.descarte) {
      task = '<div class="t muted">Descartada às ' + esc(fmtHour(s.descarte.em)) + "</div>" +
        '<div class="sub">' + esc(s.descarte.motivo || "sem motivo") + "</div>";
    } else {
      task = '<div class="t muted">' + (s.sessionEnded ? "Sessão encerrada" : "Sem tarefa em curso") + "</div>" +
        '<div class="sub">' + esc(s.lastEventType || "") + "</div>";
    }
    if (flags.length) {
      task += '<div class="flags">' + flags.map(function (f) { return '<span class="badge ' + f.level + '">' + esc(f.text) + "</span>"; }).join("") + "</div>";
    }
    var head = '<div class="cols">' +
      '<div class="c-sel"><input type="checkbox" data-select="' + sid + '"' + (selected ? " checked" : "") + ' aria-label="Selecionar ' + esc(whoOf(s)) + '"></div>' +
      '<div class="c-who who">' + who + "</div>" +
      '<div class="c-status"><span class="badge ' + st.cls + '">' + esc(st.text) + "</span></div>" +
      '<div class="c-task task-cell">' + task + "</div>" +
      '<div class="c-time"><span class="countdown" data-countdown="' + sid + '"></span></div>' +
      '<div class="c-prog">' + renderPips(s) + ' <span class="small muted num">' + s.completedScenarios + "/" + SCENARIOS + "</span></div>" +
      '<div class="c-age"><span class="age" data-age="' + sid + '">—</span></div>' +
      '<div class="c-tutor small num" title="Turnos com o tutor · erros do tutor">' + s.chatTurns + " turnos" +
      (s.tutorErrors ? ' · <b style="color:var(--danger)">' + s.tutorErrors + " erro" + (s.tutorErrors > 1 ? "s" : "") + "</b>" : "") + "</div>" +
      '<div class="c-chev chev" aria-hidden="true">›</div>' +
      "</div>";
    return '<div class="row' + (level ? " lvl-" + level : "") + (open ? " open" : "") + (selected ? " selected" : "") +
      (s.sessionEnded || s.descarte ? " ended" : "") + '" data-session="' + sid + '">' + head + (open ? renderDetail(s) : "") + "</div>";
  }

  function renderDetail(s) {
    var tasks = s.tasks || [];
    var rows = tasks.map(function (t) {
      var dur = t.elapsedMs != null ? fmtDuration(t.elapsedMs) : (t.endedAt ? "—" : "em curso");
      return "<tr><td>" + esc(shortLabel(t)) + (t.practice ? ' <span class="badge">treino</span>' : "") + "</td>" +
        "<td>" + esc(fmtHour(t.startedAt)) + "</td><td>" + esc(dur) + "</td>" +
        "<td>" + esc(t.endedAt || t.outcome ? (OUTCOMES[t.outcome] || t.outcome || "?") : "—") + (t.endedBy === "conductor" ? ' <span class="badge">condutor</span>' : "") + "</td>" +
        '<td class="num">' + esc(t.studentTurns != null ? t.studentTurns : "—") + "</td>" +
        '<td class="num">' + (t.checks ? (t.checks - t.failedChecks) + "/" + t.checks : "—") + "</td></tr>";
    }).join("");
    var tasksHtml = rows
      ? "<table><thead><tr><th>Tarefa</th><th>Início</th><th>Duração</th><th>Desfecho</th><th>Turnos</th><th>«Concluí» ok</th></tr></thead><tbody>" + rows + "</tbody></table>"
      : '<p class="muted small">Nenhuma tarefa iniciada.</p>';

    var log = (s.commands || []).map(function (c) {
      var label = c.kind === "extend" ? "+" + (c.minutes || 5) + " min" : (KINDS[c.kind] || c.kind);
      return { at: c.createdAt, html: esc(label) + " " + (c.applied ? '<span class="badge ok">aplicado</span>' : '<span class="badge warn">pendente</span>') };
    }).concat((s.notes || []).map(function (n) {
      return { at: n.createdAt, html: "<em>incidente:</em> " + esc(n.text) };
    })).sort(function (a, b) { return String(a.at).localeCompare(String(b.at)); });
    var logHtml = log.length
      ? "<ul>" + log.map(function (i) { return "<li>" + esc(fmtHour(i.at)) + " · " + i.html + "</li>"; }).join("") + "</ul>"
      : '<p class="muted small">Nada registrado.</p>';

    var meta = [
      ["Pseudônimo", s.participantId || "—"],
      ["Sessão", s.sessionId],
      ["Máquina", s.installId || "—"],
      ["Coleta", (s.coletaId ? coletaName(s.coletaId) : "sem coleta") + (s.coletaManual ? " (movida à mão)" : "")],
      ["Primeiro sinal", fmtHour(s.firstEventAt)],
      ["Build", s.buildSha ? String(s.buildSha).slice(0, 10) : "—"]
    ];
    if (s.condition) meta.splice(4, 0, ["Etapa (cond)", s.condition]);

    var noTask = !s.currentTask || s.sessionEnded;
    var actions;
    if (s.descarte) {
      actions = '<button type="button" class="sm" data-act="restore">Restaurar</button>' +
        '<button type="button" class="sm danger" data-act="erase">Apagar de vez…</button>';
    } else {
      actions =
        '<button type="button" class="sm" data-act="extend"' + (noTask ? " disabled" : "") + ">+5 min</button>" +
        '<button type="button" class="sm" data-act="accept"' + (noTask ? " disabled" : "") + ">Aceitar como resolvida</button>" +
        '<button type="button" class="sm" data-act="skip"' + (noTask ? " disabled" : "") + ">Pular tarefa</button>" +
        '<button type="button" class="sm danger" data-act="end_session"' + (s.sessionEnded ? " disabled" : "") + ">Encerrar sessão</button>" +
        '<span class="sep"></span>' +
        '<button type="button" class="sm" data-act="note">Anotar incidente</button>' +
        '<button type="button" class="sm" data-act="move">Mover para coleta…</button>' +
        '<button type="button" class="sm ghost danger" data-act="discard">Descartar</button>';
    }
    return '<div class="detail"><div class="detail-grid">' +
      "<div><h3>Tarefas</h3>" + tasksHtml + "</div>" +
      "<div><h3>Sessão</h3><dl class=\"kv\">" + meta.map(function (m) { return "<dt>" + esc(m[0]) + "</dt><dd>" + esc(m[1]) + "</dd>"; }).join("") + "</dl>" +
      "<h3>Comandos e incidentes</h3>" + logHtml + "</div>" +
      '</div><div class="actions">' + actions + "</div></div>";
  }

  function renderList() {
    var list = visibleSessions();
    var anyPool = state.sessions.filter(inPool).length;
    if (!list.length) {
      var msg;
      if (state.loading && !state.sessions.length) msg = "<b>Carregando…</b>";
      else if (anyPool) msg = "<b>Nenhuma sessão neste filtro.</b>Troque o filtro ou limpe a busca.";
      else if (state.view === VIEW_TRASH) msg = "<b>Lixeira vazia.</b>";
      else if (currentColeta() && currentColeta().status === "planejada") msg = "<b>Coleta ainda não aberta.</b>Clique em «Abrir agora» quando os participantes começarem.";
      else if (currentColeta()) msg = "<b>Nenhuma sessão nesta coleta ainda.</b>Elas aparecem aqui assim que a IDE mandar o primeiro lote de telemetria.";
      else msg = "<b>Nenhuma sessão nas últimas 24 h.</b>";
      $("list").innerHTML = '<div class="empty">' + msg + "</div>";
      return;
    }
    var allSelected = list.every(function (s) { return state.selected[s.sessionId]; });
    $("list").innerHTML =
      '<div class="cols list-head">' +
      '<div><input type="checkbox" id="select-all"' + (allSelected ? " checked" : "") + ' aria-label="Selecionar todas as visíveis"></div>' +
      "<div>Participante</div><div>Situação</div><div>Tarefa atual</div><div>Restante</div><div>Progresso</div><div>Último sinal</div><div>Tutor</div><div></div></div>" +
      list.map(renderRow).join("");
  }

  function renderBulk() {
    var ids = Object.keys(state.selected);
    var bulk = $("bulk");
    if (!ids.length) { bulk.classList.add("hidden"); return; }
    var trash = state.view === VIEW_TRASH;
    bulk.innerHTML = "<b>" + plural(ids.length, "sessão selecionada", "sessões selecionadas") + "</b>" +
      (trash
        ? '<button type="button" class="sm" data-bulk="restore">Restaurar</button><button type="button" class="sm danger" data-bulk="erase">Apagar de vez…</button>'
        : '<button type="button" class="sm" data-bulk="move">Mover para coleta…</button><button type="button" class="sm danger" data-bulk="discard">Descartar</button>') +
      '<span class="spacer"></span><button type="button" class="sm ghost" data-bulk="clear">Limpar seleção</button>';
    bulk.classList.remove("hidden");
  }

  function render() {
    // Seleção de sessões que saíram da visão não vale mais.
    var present = {};
    state.sessions.forEach(function (s) { present[s.sessionId] = true; });
    Object.keys(state.selected).forEach(function (id) { if (!present[id]) delete state.selected[id]; });

    renderViewSelect();
    renderColetaBar();
    renderStats();
    renderFilters();
    renderList();
    renderBulk();
    document.documentElement.style.setProperty("--top-h", $("top").offsetHeight + "px");
    tick();
  }

  function findSession(id) {
    for (var i = 0; i < state.sessions.length; i++) if (state.sessions[i].sessionId === id) return state.sessions[i];
    return null;
  }

  /* Atualização a cada segundo: só cronômetros e idades, sem redesenhar as linhas. */
  function tick() {
    document.querySelectorAll("[data-countdown]").forEach(function (el) {
      var s = findSession(el.getAttribute("data-countdown"));
      var rem = s ? remainingMs(s) : null;
      if (rem == null) { el.textContent = "—"; el.className = "countdown muted"; el.title = ""; return; }
      el.textContent = fmtClock(rem);
      el.className = "countdown" + (rem <= 0 ? " over" : rem < LOW_TIME_MS ? " low" : "");
      el.title = rem <= 0 ? "Tempo esgotado: a IDE deveria ter encerrado a tarefa" : "Tempo restante (relógio do aluno)";
    });
    document.querySelectorAll("[data-age]").forEach(function (el) {
      var s = findSession(el.getAttribute("data-age"));
      if (!s) return;
      var age = ageMs(s), level = staleLevel(s);
      el.textContent = age === Infinity ? "—" : "há " + fmtShortAge(age);
      el.title = (s.lastEventType ? "Último evento: " + s.lastEventType + " · " : "") + fmtHour(s.lastEventAt);
      el.className = "age" + (level ? " " + level : "");
    });
  }

  /* ---------------------------------------------------------------- ações */

  function moveDialog(ids) {
    var options = state.coletas.map(function (c) { return { value: c.id, label: coletaOptionLabel(c) }; });
    options.push({ value: "", label: "Sem coleta" });
    // Padrão: a coleta aberta; se já estamos nela, a primeira outra.
    var others = state.coletas.filter(function (c) { return c.id !== state.view; });
    var open = others.filter(function (c) { return c.status === "aberta"; })[0];
    var preset = open ? open.id : (others[0] ? others[0].id : "");
    return ask({
      title: "Mover " + plural(ids.length, "sessão", "sessões"), confirmLabel: "Mover",
      message: "A escolha manual vale mais que a janela da coleta e fica até ser trocada.",
      fields: [{ name: "coleta", label: "Para", type: "select", options: options, value: preset }]
    }).then(function (v) {
      if (!v) return;
      sessionAction("mover", ids, { coletaId: v.coleta || null }).then(function () {
        toast(plural(ids.length, "sessão movida", "sessões movidas") + " para " + (v.coleta ? "«" + coletaName(v.coleta) + "»" : "sem coleta") + ".");
      }).catch(fail);
    });
  }

  function discardDialog(ids) {
    return ask({
      title: "Descartar " + plural(ids.length, "sessão", "sessões") + "?", confirmLabel: "Descartar", danger: true,
      message: "Vai para a lixeira: some do painel e das exportações, mas nada é apagado e dá para restaurar.",
      fields: [{ name: "motivo", label: "Motivo (opcional)", placeholder: "ex.: teste do condutor, máquina trocada", maxLength: 200 }]
    }).then(function (v) {
      if (!v) return;
      sessionAction("descartar", ids, { motivo: v.motivo }).then(function () {
        toast(plural(ids.length, "sessão foi", "sessões foram") + " para a lixeira.");
      }).catch(fail);
    });
  }

  function restore(ids) {
    sessionAction("restaurar", ids).then(function () {
      toast(plural(ids.length, "sessão restaurada", "sessões restauradas") + ".");
    }).catch(fail);
  }

  function eraseDialog(ids) {
    return ask({
      title: "Apagar de vez " + plural(ids.length, "sessão", "sessões") + "?", confirmLabel: "Apagar de vez", danger: true, requireText: "APAGAR",
      message: "Remove do armazenamento a telemetria, os comandos, as notas e os turnos do tutor. Não tem volta.\n\nFica registrado só que a sessão foi apagada, quando e quantos arquivos. Use para desistência de participante ou sessão de teste."
    }).then(function (v) {
      if (!v) return;
      sessionAction("apagar", ids).then(function () {
        toast(plural(ids.length, "sessão apagada", "sessões apagadas") + " de vez.");
      }).catch(fail);
    });
  }

  function onSessionAction(s, act) {
    var who = whoOf(s);
    var task = s.currentTask ? (s.currentTask.label || shortLabel(s.currentTask)) : "";
    if (act === "note") {
      ask({
        title: "Incidente na sessão de " + who, confirmLabel: "Anotar",
        message: "Fica só no registro do condutor; não vai para a IDE.",
        fields: [{ name: "text", label: "O que aconteceu", type: "textarea", required: true, maxLength: 500 }]
      }).then(function (v) { if (v && v.text.trim()) sendCommand(s, "note", { text: v.text.trim().slice(0, 500) }); });
      return;
    }
    if (act === "move") { moveDialog([s.sessionId]); return; }
    if (act === "discard") { discardDialog([s.sessionId]); return; }
    if (act === "restore") { restore([s.sessionId]); return; }
    if (act === "erase") { eraseDialog([s.sessionId]); return; }
    var questions = {
      extend: ["+5 min para " + who + "?", "Na tarefa «" + task + "»."],
      accept: ["Aceitar «" + task + "» como resolvida?", "A IDE de " + who + " registra a tarefa como resolvida pelo condutor e avança."],
      skip: ["Pular «" + task + "»?", "A IDE de " + who + " encerra a tarefa sem resolver e avança."],
      end_session: ["Encerrar a sessão de " + who + "?", "A máquina volta ao formulário para o próximo participante."]
    };
    var q = questions[act];
    ask({ title: q[0], message: q[1], confirmLabel: act === "extend" ? "Dar +5 min" : "Confirmar", danger: act === "end_session" }).then(function (ok) {
      if (ok) sendCommand(s, act, act === "extend" ? { minutes: 5 } : null);
    });
  }

  function onListClick(event) {
    var target = event.target;
    if (target.id === "select-all") {
      var visible = visibleSessions();
      visible.forEach(function (s) { if (target.checked) state.selected[s.sessionId] = true; else delete state.selected[s.sessionId]; });
      render();
      return;
    }
    var row = target.closest("[data-session]");
    var s = row && findSession(row.getAttribute("data-session"));
    if (!s) return;
    var sel = target.closest("[data-select]");
    if (sel) {
      if (sel.checked) state.selected[s.sessionId] = true; else delete state.selected[s.sessionId];
      row.classList.toggle("selected", sel.checked);
      renderBulk();
      return;
    }
    var button = target.closest("button[data-act]");
    if (button) { onSessionAction(s, button.getAttribute("data-act")); return; }
    if (target.closest(".detail")) return;  // cliques no detalhe (texto, tabela) não fecham a linha
    if (target.closest(".cols")) {
      if (state.expanded[s.sessionId]) delete state.expanded[s.sessionId]; else state.expanded[s.sessionId] = true;
      renderList();
      tick();
    }
  }

  function onBulk(event) {
    var btn = event.target.closest("[data-bulk]");
    if (!btn) return;
    var ids = Object.keys(state.selected);
    var act = btn.getAttribute("data-bulk");
    if (act === "clear") { state.selected = {}; render(); return; }
    if (!ids.length) return;
    if (act === "move") moveDialog(ids);
    else if (act === "discard") discardDialog(ids);
    else if (act === "restore") restore(ids);
    else if (act === "erase") eraseDialog(ids);
  }

  function onFilter(event) {
    var btn = event.target.closest("[data-filter]");
    if (!btn) return;
    state.filter = btn.getAttribute("data-filter");
    savePrefs();
    render();
  }

  /* ---------------------------------------------------------------- login */

  function showLogin(message) {
    state.token = null;
    storageDel(window.sessionStorage, TOKEN_KEY);
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    $("app").classList.add("hidden");
    $("login").classList.remove("hidden");
    $("login-error").textContent = message || "";
    $("login-error").classList.toggle("hidden", !message);
    $("token-input").focus();
  }

  function showApp() {
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    render();
    refresh();
    if (!pollTimer) pollTimer = setInterval(function () { if (!state.loading) refresh(); }, POLL_MS);
  }

  $("login-form").addEventListener("submit", function (event) {
    event.preventDefault();
    var value = $("token-input").value.trim();
    if (!value) return;
    state.token = value;
    storageSet(window.sessionStorage, TOKEN_KEY, value);
    $("token-input").value = "";
    showApp();
  });
  $("logout").addEventListener("click", function () { showLogin(""); });
  $("refresh").addEventListener("click", refresh);
  $("new-coleta").addEventListener("click", newColeta);
  $("view-select").addEventListener("change", function () { setView(this.value); });
  $("coleta-bar").addEventListener("click", onColetaBar);
  $("coleta-bar").addEventListener("change", function (event) {
    if (event.target.id !== "export-select" || !event.target.value) return;
    var c = currentColeta();
    if (c) download(c.id, event.target.value);
    event.target.value = "";
  });
  $("include-test").addEventListener("change", function () { state.includeTest = this.checked; savePrefs(); render(); });
  $("sort-select").addEventListener("change", function () { state.sort = this.value; savePrefs(); render(); });
  $("search").addEventListener("input", function () { state.search = this.value; renderFilters(); renderList(); tick(); });
  $("filter-seg").addEventListener("click", onFilter);
  $("stats").addEventListener("click", onFilter);
  $("list").addEventListener("click", onListClick);
  $("bulk").addEventListener("click", onBulk);
  document.addEventListener("keydown", function (event) {
    if (event.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !$("dlg").open) {
      event.preventDefault();
      $("search").focus();
    }
  });
  window.addEventListener("resize", function () {
    document.documentElement.style.setProperty("--top-h", $("top").offsetHeight + "px");
  });
  setInterval(tick, 1000);

  loadPrefs();
  if (token()) showApp(); else showLogin("");
})();
</script>
</body>
</html>
