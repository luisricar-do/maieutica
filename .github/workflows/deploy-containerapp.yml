# Testa, constrói a imagem, publica no GHCR e põe a revisão nova no Azure Container App.
#
# A infraestrutura e as variables do repositório (AZURE_*) vêm de `scripts/azure_setup.sh`,
# corrido uma vez. A Azure é acedida por OIDC (identidade federada): não há segredo no GitHub.
name: Deploy (Container Apps)

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".cursor/**"
  workflow_dispatch:

concurrency:
  group: deploy-containerapp
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/luisricar-do/maieutica

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Poetry
        run: pipx install poetry

      - name: Instalar dependências
        run: poetry install --no-interaction

      - name: Testes (LLM mockado)
        run: poetry run pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE }}:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: BUILD_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Antes de `scripts/azure_setup.sh` não há onde publicar: a esteira só testa e constrói.
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Atualizar a imagem do Container App
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME }}
          IMAGE_REF: ${{ needs.build.outputs.image }}
        run: |
          az extension add --name containerapp --upgrade --yes --only-show-errors
          az containerapp update -g "$RG" -n "$APP" \
            --image "$IMAGE_REF" \
            --only-show-errors -o none

      - name: Smoke test (/api/ping responde o commit novo)
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME }}
          SHA: ${{ github.sha }}
        run: |
          fqdn=$(az containerapp show -g "$RG" -n "$APP" \
            --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)
          if [ -z "$fqdn" ]; then
            echo "::error::Não foi possível ler o FQDN do Container App."
            exit 1
          fi
          # Pronto é o ping devolver este commit: até lá responde a revisão antiga, ou nada enquanto
          # o host do Functions sobe a frio (import do LangGraph incluído). Não se lê mais
          # latestReadyRevisionName: a extensão containerapp passou a devolvê-lo vazio, e a esteira
          # falhava com a revisão nova já no ar.
          body=""
          for _ in $(seq 1 60); do
            body=$(curl --silent --max-time 15 "https://${fqdn}/api/ping" || true)
            if printf '%s' "$body" | grep -q "\"build\": *\"${SHA}\""; then
              echo "$body"
              echo "### Publicado em https://${fqdn}/api (${SHA:0:7})" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::/api/ping não chegou ao commit ${SHA} em 10 min. Última resposta: ${body:-vazia}"
          az containerapp revision list -g "$RG" -n "$APP" -o table || true
          exit 1
